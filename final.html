<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Final 💖</title>

<style>
body{
  height:100vh;
  margin:0;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:Arial;
  background:#0f172a;
  color:white;
  text-align:center;
  padding:20px;
}

#text{
  max-width:500px;
  font-size:22px;
  white-space:pre-line;
}
</style>
</head>

<body>

<div id="text"></div>

<script>
let msg = `💖 Okay listen...

You passed all the games 😏

Just wanted to say that I'll be coming on 11th:

I love you thangam mata kammali ane ekai me.

Ummmmmmmmmmmmaaaaaaaaaaaa 😂❤️`;

let i = 0;
let speed = 50;

function type(){
  const box = document.getElementById("text");

  if(i < msg.length){
    box.innerHTML += msg.charAt(i);
    i++;
    setTimeout(type, speed);
  }
}

type();
</script>

</body>
</html>
